<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Čiurlionis · Kelionė</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #1d1a22; overflow: hidden; font-family: Georgia, 'Times New Roman', serif; }
      #view, #view canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      /* what is seen until the picture is ready: the sea's own sky and water, laid in flat */
      #backdrop { position: fixed; inset: 0; transition: opacity 2.2s; pointer-events: none;
        background: linear-gradient(to bottom, #82bcdd 0%, #a9c6dc 22%, #e9c3c6 44%, #f6dfb0 60%, #f8e7b6 63%, #4d6fc0 63.2%, #3a5db4 78%, #2c4c9f 100%); }
      #backdrop.gone { opacity: 0; }
      #title { position: fixed; inset: 0; display: grid; place-items: end start; pointer-events: none; transition: opacity 2.4s; }
      #title.gone { opacity: 0; }
      #title.off { display: none; }
      #title div.words { margin: 0 5vw 10vh 6vw; text-align: left; color: #fff6dd; text-shadow: 0 1px 14px rgba(40, 30, 60, 0.75), 0 0 2px rgba(40, 30, 60, 0.6); }
      #title h1 { margin: 0; font-weight: normal; font-size: clamp(30px, 4.8vw, 72px); letter-spacing: 0.28em; }
      #title h2 { margin: 0.5em 0 0; font-weight: normal; font-style: italic; font-size: clamp(15px, 1.7vw, 22px); letter-spacing: 0.12em; }
      #bar { width: min(340px, 56vw); height: 3px; margin: 2.2em 0 0; background: rgba(255, 246, 221, 0.28); border-radius: 2px; overflow: hidden; transition: opacity 0.8s; }
      #bar i { display: block; height: 100%; width: 3%; background: #fff6dd; border-radius: 2px; transition: width 0.35s ease-out; box-shadow: 0 0 10px rgba(255, 246, 221, 0.9); animation: breathe 1.6s ease-in-out infinite; }
      #bar.done { opacity: 0; }
      #begin { margin: 0.9em 0 0; font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.9; min-height: 1.4em; }
      #begin.ready { animation: breathe 2.4s ease-in-out infinite; }
      @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      #caption { position: fixed; left: 0; right: 0; top: 9vh; text-align: center; color: #fff6dd; opacity: 0; transition: opacity 1.8s; pointer-events: none;
        text-shadow: 0 1px 12px rgba(40, 30, 60, 0.7), 0 0 2px rgba(40, 30, 60, 0.55); }
      #caption.on { opacity: 1; }
      #caption b { display: block; font-weight: normal; font-size: clamp(22px, 2.8vw, 38px); letter-spacing: 0.22em; text-indent: 0.22em; }
      #caption i { display: block; margin-top: 0.5em; font-size: clamp(13px, 1.25vw, 17px); letter-spacing: 0.1em; }
      #pearls { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; pointer-events: none; opacity: 0; transition: opacity 2s; }
      #pearls.on { opacity: 1; }
      #pearls span { width: 15px; height: 15px; border-radius: 50%; border: 1px solid rgba(255, 240, 235, 0.6); background: rgba(43, 37, 48, 0.22); transition: all 1.2s; }
      #pearls span.got { background: radial-gradient(circle at 35% 30%, #fffaf6, #f3c7cf 55%, #c98fa6); border-color: rgba(255, 250, 246, 0.9); box-shadow: 0 0 14px rgba(255, 225, 230, 0.95); transform: scale(1.2); }
      #hint { position: fixed; right: 18px; bottom: 16px; color: #fff6dd; font-size: 12px; letter-spacing: 0.06em; opacity: 0; transition: opacity 2s; pointer-events: none;
        text-shadow: 0 1px 6px rgba(40, 30, 60, 0.8); text-align: right; line-height: 1.6; max-width: 34vw; }
      #hint.on { opacity: 0.78; }
      #hint.off { display: none; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="backdrop"></div>
    <div id="caption"><b></b><i></i></div>
    <div id="pearls"></div>
    <div id="hint">Click, then mouse to look · WASD to swim and walk · Shift run · Space jump<br />wheel steps back · Enter full screen · M music · F2 fps · H hides this</div>
    <div id="title"><div class="words"><h1>ČIURLIONIS</h1><h2>Kelionė · a walk through the paintings</h2><div id="bar"><i></i></div><p id="begin">Loading</p></div></div>
    <script type="module" src="/src/journey/main.js"></script>
  </body>
</html>
